<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zubalenok — Lifetime Access · Black Friday</title>
  <meta name="description" content="Lifetime access to all Zubalenok courses. One payment, lifetime results.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Onest:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="page">
<section class="s-stat" id="stat" data-section="04-stat">
  <div class="s-stat__frame">
    <img class="s-stat__bg only-m" src="../images/04-stat/bg-m.webp" alt="" width="428" height="458" decoding="async">
    <img class="s-stat__bg only-d" src="../images/04-stat/bg-d.webp" alt="" width="1440" height="370" decoding="async">
    <div class="s-stat__grain" aria-hidden="true"></div>

    <div class="s-stat__card s-stat__card--sahra only-d"><img src="../images/04-stat/card-sahra.webp" alt="Review by Sahra" width="230" height="140" loading="lazy" decoding="async"></div>
    <div class="s-stat__card s-stat__card--anna only-d"><img src="../images/04-stat/card-anna.webp" alt="Review by Anna" width="242" height="148" loading="lazy" decoding="async"></div>
    <div class="s-stat__card s-stat__card--lena only-d"><img src="../images/04-stat/card-lena.webp" alt="Review by Lena" width="258" height="158" loading="lazy" decoding="async"></div>

    <p class="s-stat__num" aria-label="65%"><span class="s-stat__big" data-count="65" aria-hidden="true">65</span><span class="s-stat__pct" aria-hidden="true">%</span></p>
    <h2 class="s-stat__title">of Lifetime access holders continue training regularly for more than 6 months</h2>
    <img class="s-stat__line" src="../images/04-stat/line.svg" alt="" width="81" height="1">
    <p class="s-stat__cap only-d">proving the course’s effectiveness and long-term value</p>
    <p class="s-stat__cap only-m">stay consistent &amp;<br>keep progressing<br>at your own pace</p>
  </div>
</section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js"></script>
  <script src="../js/app.js" defer></script>
</body>
</html>
