<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zubalenok — Lifetime Access · Black Friday</title>
  <meta name="description" content="Lifetime access to all Zubalenok courses. One payment, lifetime results.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Onest:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="page">
<section class="s-watch-video" id="watch-video" data-section="09-watch-video">
  <div class="s-watch-video__inner">
    <h2 class="s-watch-video__title" data-reveal>
      <span class="s-watch-video__l1 s-watch-video__red">Watch<span class="only-m"> the Video</span></span>
      <span class="s-watch-video__l2"><span class="only-d">the Video to</span></span>
      <span class="s-watch-video__l3"><span class="only-d">Learn More!</span><span class="only-m">to Learn More!</span></span>
    </h2>
    <div class="s-watch-video__poster js-video" data-video-src="media/watch.mp4" data-reveal="zoom" data-delay="120">
      <picture>
        <source media="(min-width:800px)" srcset="../images/09-watch-video/poster-d.webp">
        <img class="s-watch-video__img" src="../images/09-watch-video/poster-m.webp" alt="Course preview video" width="380" height="300" loading="lazy" decoding="async">
      </picture>
      <button class="s-watch-video__btn" type="button" aria-label="Play video">
        <img class="s-watch-video__ring" src="../images/09-watch-video/ring.svg" alt="" width="210" height="210">
        <span class="s-watch-video__label">watch video</span>
        <span class="s-watch-video__play">
          <img class="s-watch-video__play-bg" src="../images/09-watch-video/play-bg.svg" alt="" width="60" height="60">
          <img class="s-watch-video__play-ic" src="../images/09-watch-video/play.svg" alt="" width="18" height="18">
        </span>
      </button>
    </div>
  </div>
</section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js"></script>
  <script src="../js/app.js" defer></script>
</body>
</html>
