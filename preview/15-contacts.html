<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <main class="page">
<section class="s-contacts" id="contacts" data-section="15-contacts">
  <div class="s-contacts__inner">
    <h2 class="s-contacts__title h-display" data-reveal>Contacts</h2>

    <div class="s-contacts__tiles">
      <a class="s-contacts__tile" href="" aria-label="Instagram: Zubalenok" data-reveal="zoom" data-delay="80">
        <img src="../images/15-contacts/instagram.webp" alt="" width="34" height="34" loading="lazy" decoding="async">
        <span>Zubalenok</span>
      </a>
      <a class="s-contacts__tile" href="" aria-label="Email" data-reveal="zoom" data-delay="180">
        <img src="../images/15-contacts/email.svg" alt="" width="36" height="30" loading="lazy" decoding="async">

      </a>
      <a class="s-contacts__tile" href="" aria-label="Support on Telegram" data-reveal="zoom" data-delay="280">
        <img src="../images/15-contacts/support.svg" alt="" width="31" height="30" loading="lazy" decoding="async">
        <span>Support</span>
      </a>
    </div>

    <div class="s-contacts__legal" data-reveal data-delay="120">
      <p><a class="s-contacts__policy" href="">Privacy Policy and user agreement</a></p>
      <p>© 2026, ZBL COMPANY BV, Roeselare, BE 1022336448</p>
    </div>

    <picture class="s-contacts__pay" data-reveal data-delay="200">
      <source media="(min-width:800px)" srcset="../images/15-contacts/pay-d.webp">
      <img src="../images/15-contacts/pay-m.webp" alt="Accepted payments: Visa, Mastercard, Klarna, American Express, Apple Pay, Google Pay" width="256" height="20" loading="lazy" decoding="async">
    </picture>
  </div>
</section>

  </main>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js"></script>
  <script src="../js/app.js" defer></script>
